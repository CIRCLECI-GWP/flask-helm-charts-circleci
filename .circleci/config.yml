version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.2
  aws-ecr: circleci/aws-ecr@10.0.0

jobs:
  deploy_helm_chart:
    docker:
      - image: cimg/python:3.14.9
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Install Helm
          command: |
            curl -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz | tar xz
            sudo mv linux-amd64/helm /usr/local/bin/helm && rm -rf linux-amd64
            helm version
      - run:
          name: Configure access to the EKS cluster
          command: aws eks update-kubeconfig --region $AWS_CLUSTER_REGION --name $AWS_EKS_CLUSTER_NAME
      - run:
          name: Push the Helm chart to ECR
          command: |
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | helm registry login --username AWS --password-stdin $AWS_ECR_ACCOUNT_URL
            helm package charts --version 1.0.0 --destination dist
            helm push dist/*.tgz oci://$AWS_ECR_ACCOUNT_URL
      - run:
          name: Install or upgrade the Helm release
          command: |
            helm upgrade --install flask-helm oci://$AWS_ECR_ACCOUNT_URL/$AWS_ECR_HELM_REPO_NAME --version 1.0.0 \
              --set image.repository=$AWS_ECR_ACCOUNT_URL/$AWS_ECR_REPO_NAME --set-string image.tag=$CIRCLE_SHA1 \
              --wait --timeout 5m

workflows:
  build_and_deploy:
    jobs:
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup
          repo: ${AWS_ECR_REPO_NAME}
          tag: latest,${CIRCLE_SHA1}
      - deploy_helm_chart:
          requires:
            - aws-ecr/build_and_push_image
